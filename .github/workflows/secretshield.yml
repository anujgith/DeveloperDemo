name: SecretShield

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretshield:
    name: SecretShield security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DeveloperDemo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run SecretShield
        uses: anujgith/SecretShield@main